# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deploy MkDocs

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements.txt

    # Required by the social plugin (enabled when CI=true) to render cards.
    - name: Install system libraries
      run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev pngquant

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Cache social cards
      uses: actions/cache@v4
      with:
        key: mkdocs-material-${{ hashFiles('mkdocs.yml') }}
        path: .cache
        restore-keys: mkdocs-material-

    - name: Build
      run: mkdocs build --strict

    - name: Upload Pages artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@v4
      with:
        path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: https://edu.roalgo.ro

    steps:
    - name: Deploy
      uses: actions/deploy-pages@v5
